[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-stack"
version = "0.1.0"
description = "Deterministic local runtime for evidence-based investment analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-Proprietary"
authors = [{ name = "investment-stack contributors" }]
dependencies = [
    "tzdata; sys_platform == 'win32'",
    "truststore>=0.9.1; python_version >= '3.10'",
]

[project.scripts]
investment-stack = "investment_stack.cli:main"

[tool.setuptools]
package-dir = { "" = "runtime" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["runtime"]
include = ["investment_stack*"]
